<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryan Campbell | EECS @ UC Berkeley</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
</head>
<body>
    <script>try { if (localStorage.getItem('riensou-theme') !== 'light') document.body.classList.add('dark-mode'); } catch (e) {}</script>
    <header class="top-nav">
        <nav class="nav">
            <a href="#about" class="nav-link active" data-section="about">about</a>
            <!-- hidden sections live in sections/: experience, research, projects.
                 To re-enable one, add its nav link here and a panel below. -->
            <a href="#contact" class="nav-link" data-section="contact">contact</a>
            <a href="#music" class="nav-link" data-section="music">music</a>
            <a href="#notebook" class="nav-link" data-section="notebook">notebook</a>
        </nav>
        <button type="button" class="dark-mode-btn" id="dark-mode-btn" aria-label="Toggle dark mode">Light</button>
    </header>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <img class="sidebar-photo" src="assets/ryan.jpg" alt="Ryan Campbell">
            <img class="sidebar-photo-music" src="assets/spotify-profile.png" alt="Ryan Campbell">
            <img class="sidebar-photo-contact" src="assets/contact.jpg" alt="Ryan Campbell">
            <h1>Ryan Campbell</h1>
            <div class="sidebar-default-blurb">
                <p class="sidebar-title">UC Berkeley EECS MS</p>
                <p class="sidebar-subtitle">Robotics, Applied ML, Deep RL.</p>
            </div>
            <div class="sidebar-music-blurb">
                <p class="sidebar-title">Jazz Musician</p>
                <p class="sidebar-subtitle">Composer, Performer, Instructor.</p>
            </div>
        </aside>
        <main class="main">
            <div id="about-panel" class="panel active">
                <div class="panel-content" data-src="sections/about.html"></div>
            </div>
            <!-- notebook content is rendered by app.js from notebook/notes.json + notebook/*.md -->
            <div id="notebook-panel" class="panel">
                <div class="panel-content"></div>
            </div>
            <div id="music-panel" class="panel">
                <div class="panel-content" data-src="sections/music.html"></div>
            </div>
            <div id="contact-panel" class="panel">
                <div class="panel-content" data-src="sections/contact.html"></div>
            </div>
        </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/mhchem.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/smiles-drawer@2.1.7/dist/smiles-drawer.min.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
